[build-system]
requires = ['setuptools']
build-backend = 'setuptools.build_meta'

[project]
name = 'HumanModels'
version = '0.0.1'

[tool.setuptools.packages.find]
where = ['src']

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
