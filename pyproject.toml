[build-system]
requires = ['setuptools']
build-backend = 'setuptools.build_meta'

[project]
name = "hmodel"
version = '0.0.1'
requires-python = ">=3.10"

dependencies = [
    "torch",
    "torchvision",
    "roma",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
torchaudio = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.setuptools.packages.find]
where = ['src']

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
viz  = ["rerun-sdk"]

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88